{% extends "base.html" %}

{% block title %}Server Error - PerfumeAI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <div class="card shadow-sm border-0">
                <div class="card-body py-5">
                    <div class="display-4 text-danger mb-3">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h1 class="h3 mb-2">Something went wrong</h1>
                    <p class="text-muted mb-4">
                        We hit an unexpected server error. Please try again in a moment.
                    </p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('index') }}"
                           class="btn btn-primary">
                            <i class="fas fa-home me-1"></i> Go Back
                        </a>
                        <a href="{{ url_for('perfumes') if session.get('user_id') else url_for('login') }}"
                           class="btn btn-outline-secondary">
                            <i class="fas fa-spray-can me-1"></i> Browse Perfumes
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
